name: Update personal site
on:
  push:
    paths:
      - '**/*.md'
      - '!scripts/**'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Request site rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api --method POST repos/lvcxss/landingpage/dispatches -f event_type=content-updated
